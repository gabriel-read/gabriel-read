<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Tools: Python, SQL, Jupyter, Google Cloud">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .lbl{font-size:12px;letter-spacing:3px;fill:#5b6b8c}
      .bar{transform-origin:left;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.6,0,.2,1) forwards}
      @keyframes grow{to{transform:scaleX(1)}}
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="249" rx="22" fill="#060a13" stroke="#1c2947"/>
  <text x="56" y="54" class="mono lbl">TECHNOLOGY SPECTRUM</text>
  <text x="56" y="92" class="mono" font-size="26" font-weight="700" fill="#e6edf7">The tools behind the work</text>
  <line x1="56" y1="116" x2="1144" y2="116" stroke="#1c2947" stroke-dasharray="6 6"/>

  <g class="mono">
    <!-- Python -->
    <rect x="56" y="140" width="34" height="34" rx="8" fill="#0f1d33" stroke="#1e3a5f"/>
    <text x="73" y="162" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">Py</text>
    <text x="102" y="162" font-size="16" fill="#e6edf7">Python</text>
    <text x="56" y="198" font-size="12" fill="#6b7fa6">ETL · scraping · models</text>
    <rect x="56" y="212" width="230" height="2" fill="#1c2947"/>
    <rect class="bar" x="56" y="212" width="230" height="2" fill="#3b82f6"/>

    <!-- SQL -->
    <rect x="330" y="140" width="34" height="34" rx="8" fill="#0f2621" stroke="#14532d"/>
    <text x="347" y="162" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">SQL</text>
    <text x="376" y="162" font-size="16" fill="#e6edf7">SQL</text>
    <text x="330" y="198" font-size="12" fill="#6b7fa6">queries · data modeling</text>
    <rect x="330" y="212" width="230" height="2" fill="#1c2947"/>
    <rect class="bar" x="330" y="212" width="230" height="2" fill="#22c55e" style="animation-delay:.15s"/>

    <!-- Jupyter -->
    <rect x="604" y="140" width="34" height="34" rx="8" fill="#2a1a0e" stroke="#7c2d12"/>
    <text x="621" y="162" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle">JU</text>
    <text x="650" y="162" font-size="16" fill="#e6edf7">Jupyter</text>
    <text x="604" y="198" font-size="12" fill="#6b7fa6">risk analytics · VaR</text>
    <rect x="604" y="212" width="230" height="2" fill="#1c2947"/>
    <rect class="bar" x="604" y="212" width="230" height="2" fill="#f97316" style="animation-delay:.3s"/>

    <!-- Google Cloud / Workspace -->
    <rect x="878" y="140" width="34" height="34" rx="8" fill="#1f1733" stroke="#4c1d95"/>
    <text x="895" y="162" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">GC</text>
    <text x="924" y="162" font-size="16" fill="#e6edf7">Google Cloud</text>
    <text x="878" y="198" font-size="12" fill="#6b7fa6">Apps Script · Looker Studio</text>
    <rect x="878" y="212" width="266" height="2" fill="#1c2947"/>
    <rect class="bar" x="878" y="212" width="266" height="2" fill="#8b5cf6" style="animation-delay:.45s"/>
  </g>
</svg>
