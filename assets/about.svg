<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="About — actuarial mathematics student at INTEC focused on financial risk, compliance and data">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#111a30" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="360" rx="22"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .lbl{font-size:12px;letter-spacing:3px;fill:#5b6b8c}
      .item{opacity:0;animation:fade .6s ease forwards}
      @keyframes fade{to{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#060a13"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="22" fill="none" stroke="#1c2947"/>

  <text x="56" y="56" class="mono lbl">ABOUT / WHAT I WORK ON</text>
  <text x="56" y="98" class="mono" font-size="20" fill="#e6edf7">Actuarial mathematics student at INTEC, focused on</text>
  <text x="56" y="128" class="mono" font-size="20" fill="#e6edf7"><tspan fill="#93c5fd" font-weight="700">financial risk, compliance &amp; data</tspan>. I build pipelines and</text>
  <text x="56" y="158" class="mono" font-size="20" fill="#e6edf7">automations with <tspan fill="#93c5fd" font-weight="700">Python &amp; SQL</tspan>.</text>
  <line x1="56" y1="186" x2="1144" y2="186" stroke="#1c2947" stroke-dasharray="6 6"/>

  <g class="mono">
    <g class="item" style="animation-delay:.2s">
      <rect x="56" y="214" width="4" height="40" fill="#f97316"/>
      <text x="76" y="230" font-size="15" font-weight="700" fill="#e6edf7">Risk analytics</text>
      <text x="76" y="252" font-size="12" fill="#6b7fa6">VaR · risk-adjusted performance · credit risk</text>
    </g>
    <g class="item" style="animation-delay:.4s">
      <rect x="610" y="214" width="4" height="40" fill="#3b82f6"/>
      <text x="630" y="230" font-size="15" font-weight="700" fill="#e6edf7">Derivatives</text>
      <text x="630" y="252" font-size="12" fill="#6b7fa6">option pricing · Black-Scholes vs Heston</text>
    </g>
    <g class="item" style="animation-delay:.6s">
      <rect x="56" y="282" width="4" height="40" fill="#22c55e"/>
      <text x="76" y="298" font-size="15" font-weight="700" fill="#e6edf7">Compliance automation</text>
      <text x="76" y="320" font-size="12" fill="#6b7fa6">AML/KYC validation · unsupervised anomaly detection</text>
    </g>
    <g class="item" style="animation-delay:.8s">
      <rect x="610" y="282" width="4" height="40" fill="#8b5cf6"/>
      <text x="630" y="298" font-size="15" font-weight="700" fill="#e6edf7">Data engineering</text>
      <text x="630" y="320" font-size="12" fill="#6b7fa6">ETL · regulatory &amp; economic scraping · dashboards</text>
    </g>
  </g>
</svg>
