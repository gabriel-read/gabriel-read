<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Gabriel Read — Financial Risk, Compliance &amp; Data">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#14203a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" x2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset=".3" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="440" rx="22"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .lbl{font-size:12px;letter-spacing:3px;fill:#5b6b8c}
      .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.6s cubic-bezier(.6,0,.2,1) .3s forwards}
      .tail{opacity:0;animation:fade 1s ease 2.4s forwards}
      .var{opacity:0;animation:fade .6s ease 2.8s forwards}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .scan{animation:scan 6s linear infinite}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes fade{to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes scan{from{transform:translateX(0)}to{transform:translateX(440px)}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="#060a13"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <rect width="1200" height="440" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="22" fill="none" stroke="#1c2947"/>

  <!-- header -->
  <text x="56" y="56" class="mono lbl">GABRIEL-READ / RISK · DATA · AUTOMATION</text>
  <circle cx="1124" cy="51" r="4" fill="#22c55e" class="pulse"/>
  <text x="1110" y="56" class="mono lbl" text-anchor="end">LIVE</text>

  <!-- identity -->
  <text x="56" y="124" class="mono" font-size="13" letter-spacing="4" fill="#3b82f6">HELLO, WORLD. I'M</text>
  <text x="54" y="196" class="mono" font-size="64" font-weight="700" fill="#e6edf7">Gabriel</text>
  <text x="54" y="262" class="mono" font-size="64" font-weight="700" fill="#e6edf7">Read<tspan fill="#3b82f6" class="cursor">_</tspan></text>
  <text x="56" y="304" class="mono" font-size="17" font-weight="600" fill="#cbd5e1">Actuarial Mathematics · Financial Risk</text>
  <text x="56" y="330" class="mono" font-size="13" fill="#6b7fa6">Santo Domingo, Dominican Republic</text>

  <!-- loss distribution -->
  <line x1="690" y1="318" x2="1150" y2="318" stroke="#22304f"/>
  <path class="tail" d="M700.0,318 L700.0,317.9 L705.0,317.9 L710.0,317.9 L715.0,317.8 L720.0,317.7 L725.0,317.6 L730.0,317.5 L735.0,317.3 L740.0,317.1 L745.0,316.8 L750.0,316.4 L755.0,315.9 L760.0,315.2 L765.0,314.4 L770.0,313.4 L775.0,312.1 L780.0,310.6 L785.0,308.7 L790.0,306.4 L795.0,303.6 L800.0,300.4 L805.0,296.6 L810.0,292.3 L815.0,287.3 L820.0,281.6 L825.0,275.3 L825.0,318 Z" fill="#f97316" fill-opacity=".28"/>
  <path class="draw" d="M700.0,317.9 L705.0,317.9 L710.0,317.9 L715.0,317.8 L720.0,317.7 L725.0,317.6 L730.0,317.5 L735.0,317.3 L740.0,317.1 L745.0,316.8 L750.0,316.4 L755.0,315.9 L760.0,315.2 L765.0,314.4 L770.0,313.4 L775.0,312.1 L780.0,310.6 L785.0,308.7 L790.0,306.4 L795.0,303.6 L800.0,300.4 L805.0,296.6 L810.0,292.3 L815.0,287.3 L820.0,281.6 L825.0,275.3 L830.0,268.2 L835.0,260.4 L840.0,252.0 L845.0,243.0 L850.0,233.5 L855.0,223.5 L860.0,213.2 L865.0,202.8 L870.0,192.3 L875.0,182.0 L880.0,172.2 L885.0,162.8 L890.0,154.3 L895.0,146.6 L900.0,140.2 L905.0,134.9 L910.0,131.1 L915.0,128.8 L920.0,128.0 L925.0,128.8 L930.0,131.1 L935.0,134.9 L940.0,140.2 L945.0,146.6 L950.0,154.3 L955.0,162.8 L960.0,172.2 L965.0,182.0 L970.0,192.3 L975.0,202.8 L980.0,213.2 L985.0,223.5 L990.0,233.5 L995.0,243.0 L1000.0,252.0 L1005.0,260.4 L1010.0,268.2 L1015.0,275.3 L1020.0,281.6 L1025.0,287.3 L1030.0,292.3 L1035.0,296.6 L1040.0,300.4 L1045.0,303.6 L1050.0,306.4 L1055.0,308.7 L1060.0,310.6 L1065.0,312.1 L1070.0,313.4 L1075.0,314.4 L1080.0,315.2 L1085.0,315.9 L1090.0,316.4 L1095.0,316.8 L1100.0,317.1 L1105.0,317.3 L1110.0,317.5 L1115.0,317.6 L1120.0,317.7 L1125.0,317.8 L1130.0,317.9 L1135.0,317.9 L1140.0,317.9" fill="none" stroke="url(#curve)" stroke-width="2.5" stroke-linejoin="round"/>
  <g class="var">
    <line x1="825" y1="150" x2="825" y2="318" stroke="#f97316" stroke-dasharray="4 5"/>
    <text x="815" y="160" class="mono" font-size="12" letter-spacing="2" fill="#fb923c" text-anchor="end">VaR 95%</text>
    <text x="920" y="112" class="mono" font-size="11" letter-spacing="2" fill="#5b6b8c" text-anchor="middle">P&amp;L DISTRIBUTION</text>
  </g>
  <rect class="scan" x="700" y="110" width="1" height="208" fill="#60a5fa" opacity=".35"/>

  <!-- footer cells -->
  <line x1="56" y1="364" x2="1144" y2="364" stroke="#1c2947"/>
  <g class="mono">
    <text x="56"  y="392" class="lbl" font-size="11">FOCUS</text>
    <text x="56"  y="416" font-size="15" fill="#e6edf7">Risk &amp; Compliance</text>
    <text x="330" y="392" class="lbl" font-size="11">STACK</text>
    <text x="330" y="416" font-size="15" fill="#e6edf7">Python · SQL</text>
    <text x="604" y="392" class="lbl" font-size="11">EDUCATION</text>
    <text x="604" y="416" font-size="15" fill="#e6edf7">INTEC</text>
    <text x="878" y="392" class="lbl" font-size="11">BUILDING</text>
    <text x="878" y="416" font-size="15" fill="#e6edf7">Data pipelines &amp; automation</text>
  </g>
</svg>
