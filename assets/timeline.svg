<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Timeline — when each project shipped">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#111a30" stroke-width="1"/>
    </pattern>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .lbl{font-size:12px;letter-spacing:3px;fill:#5b6b8c}
      .grow{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.4s cubic-bezier(.6,0,.2,1) forwards}
      .stop{opacity:0;animation:fade .5s ease forwards}
      .packet{animation:travel 5s linear infinite}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes fade{to{opacity:1}}
      @keyframes travel{from{transform:translateX(0)}to{transform:translateX(960px)}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#060a13"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="22" fill="none" stroke="#1c2947"/>

  <text x="56" y="56" class="mono lbl">TIMELINE / SHIPPING LOG</text>
  <text x="56" y="96" class="mono" font-size="26" font-weight="700" fill="#e6edf7">From first commit to latest release</text>

  <line x1="120" y1="212" x2="1080" y2="212" stroke="#1c2947" stroke-width="2"/>
  <line x1="120" y1="212" x2="1080" y2="212" stroke="url(#rail)" stroke-width="2" class="grow"/>
  <circle cx="120" cy="212" r="3" fill="#93c5fd" class="packet"/>

  <g class="mono">
    <!-- 1 -->
    <g class="stop" style="animation-delay:.4s">
      <circle cx="120" cy="212" r="16" fill="#1f140b" stroke="#f97316"/>
      <text x="120" y="217" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">01</text>
      <text x="104" y="150" font-size="11" letter-spacing="2" fill="#5b6b8c">JAN 2026</text>
      <text x="104" y="174" font-size="14" font-weight="700" fill="#e6edf7">proyectos_actuariales_varios</text>
    </g>
    <!-- 2 -->
    <g class="stop" style="animation-delay:1s">
      <circle cx="440" cy="212" r="16" fill="#0b1730" stroke="#3b82f6"/>
      <text x="440" y="217" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">02</text>
      <text x="440" y="256" font-size="14" font-weight="700" fill="#e6edf7" text-anchor="middle">unsupervised-aml-clustering-kdd</text>
      <text x="440" y="278" font-size="11" fill="#6b7fa6" text-anchor="middle">K-Means for AML detection</text>
      <text x="440" y="302" font-size="11" letter-spacing="2" fill="#5b6b8c" text-anchor="middle">MAR 2026</text>
    </g>
    <!-- 3 -->
    <g class="stop" style="animation-delay:1.6s">
      <circle cx="760" cy="212" r="16" fill="#0b1730" stroke="#3b82f6"/>
      <text x="760" y="217" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">03</text>
      <text x="760" y="150" font-size="11" letter-spacing="2" fill="#5b6b8c" text-anchor="middle">MAR 2026</text>
      <text x="760" y="174" font-size="14" font-weight="700" fill="#e6edf7" text-anchor="middle">blackscholesvsheston-option-valuation</text>
    </g>
    <!-- 4 -->
    <g class="stop" style="animation-delay:2.2s">
      <circle cx="1080" cy="212" r="16" fill="#16123a" stroke="#8b5cf6"/>
      <text x="1080" y="217" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">04</text>
      <text x="1080" y="256" font-size="14" font-weight="700" fill="#e6edf7" text-anchor="end" dx="16">gabriel-read</text>
      <text x="1096" y="278" font-size="11" fill="#6b7fa6" text-anchor="end">this profile</text>
      <text x="1096" y="302" font-size="11" letter-spacing="2" fill="#5b6b8c" text-anchor="end">NOV 2026</text>
    </g>
  </g>

  <line x1="56" y1="336" x2="1144" y2="336" stroke="#1c2947" stroke-dasharray="2 6"/>
  <text x="56" y="358" class="mono" font-size="11" fill="#5b6b8c">4 featured repositories · Python · risk, derivatives &amp; compliance</text>
</svg>
